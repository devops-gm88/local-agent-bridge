name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: no dependencies to install
        run: node --version
      - name: the suite (133 pass, 1 skips off the owner's machine)
        run: npm test
      - name: generated n8n nodes are not stale
        run: node scripts/build-n8n-code.js --check
